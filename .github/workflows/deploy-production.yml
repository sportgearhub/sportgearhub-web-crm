name: Build and Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  APP_DIR: ${{ vars.APP_DIR || '/opt/sportgearhub-web-provider' }}
  RELEASE_ARCHIVE: sportgearhub-web-provider.tar.gz
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment configuration::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Pack release
        run: tar -czf "$RELEASE_ARCHIVE" Dockerfile docker-compose.yml .dockerignore dist

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" "$RELEASE_ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$RELEASE_ARCHIVE"

      - name: Deploy on target host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          WEB_PROVIDER_HTTP_PORT: ${{ vars.WEB_PROVIDER_HTTP_PORT || '8080' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' RELEASE_ARCHIVE='$RELEASE_ARCHIVE' WEB_PROVIDER_HTTP_PORT='$WEB_PROVIDER_HTTP_PORT' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          tar -xzf "/tmp/$RELEASE_ARCHIVE" -C "$APP_DIR"
          rm -f "/tmp/$RELEASE_ARCHIVE"

          cat > "$APP_DIR/.env" <<ENVEOF
          WEB_PROVIDER_HTTP_PORT=$WEB_PROVIDER_HTTP_PORT
          ENVEOF

          docker network inspect apps-proxy >/dev/null 2>&1 || docker network create apps-proxy

          cd "$APP_DIR"
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
          else
            docker-compose up -d --build
          fi
          EOF
